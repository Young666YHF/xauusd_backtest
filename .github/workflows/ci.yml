# =============================================================================
# CI Pipeline - Continuous Integration
# Triggers: push to main/develop, PR creation
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop, 'feature/*', 'fix/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Code Quality & Security
  # ===========================================================================
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 bandit

      - name: Check code formatting (black)
        run: black --check --diff core/ strategies/ engines/ optimizers/ web/ tests/

      - name: Lint with flake8
        run: flake8 core/ strategies/ engines/ optimizers/ web/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E402,E501,F401,F541,F811,F841

      - name: Security scan (bandit)
        run: bandit -r core/ strategies/ engines/ optimizers/ web/ -f json -o bandit-report.json || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short \
            --cov=core --cov=strategies --cov=engines --cov=optimizers \
            --cov-report=xml --cov-report=term-missing \
            -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            coverage.xml
            .pytest_cache/

  # ===========================================================================
  # Docker Build Test
  # ===========================================================================
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (production)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: xauusd-backtest:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (backtest)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: backtest
          push: false
          tags: xauusd-backtest:backtest-test
          cache-from: type=gha

  # ===========================================================================
  # Integration Test (Web API)
  # ===========================================================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-22.04
    needs: [docker-build-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run container
        run: |
          docker build -t xauusd-backtest:integration --target production .
          docker run -d --name xauusd-test -p 8000:8000 xauusd-backtest:integration
          sleep 10

      - name: Test health endpoint
        run: |
          curl -sf http://localhost:8000/api/health || exit 1
          curl -sf http://localhost:8000/api/version || exit 1
          curl -sf http://localhost:8000/api/strategies || exit 1

      - name: Cleanup
        if: always()
        run: |
          docker stop xauusd-test || true
          docker rm xauusd-test || true
