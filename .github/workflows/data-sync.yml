# =============================================================================
# Data Sync Workflow - Triggered by data system updates
# =============================================================================
name: Data Sync

on:
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:

jobs:
  sync-data:
    name: Sync Data to Backtest System
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout backtest code
        uses: actions/checkout@v4

      - name: Trigger data validation
        run: |
          echo "Data updated in xauusd_data repository"
          echo "Triggering backtest system data refresh..."

      - name: Notify staging
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST ${{ secrets.STAGING_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"event":"data_sync","repository":"xauusd_data"}' || true
